productName = "Chiikawarden"
version = "0.1.0"
identifier = "com.chiikawarden.desktop"

[build]
beforeDevCommand = "bun run dev:ui"
devUrl = "http://localhost:5174"
beforeBuildCommand = "bun run build:ui"
frontendDist = "../dist"

[app]
macOSPrivateApi = true
withGlobalTauri = true


[[app.windows]]
title = "Chiikawarden"
width = 1200
height = 800
minWidth = 800
minHeight = 600
resizable = true
center = true
decorations = true
transparent = false
alwaysOnTop = false
skipTaskbar = false
fullscreen = false
maximized = false
visible = true
focus = true
shadow = true
acceptFirstMouse = false
tabbingIdentifier = "chiikawarden"
additionalBrowserArgs = "--disable-features=VizDisplayCompositor --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding"

[app.security]
csp = "default-src 'self'; connect-src 'self' https://api.bitwarden.com https://notifications.bitwarden.com https://vault.bitwarden.com https://identity.bitwarden.com https://icons.bitwarden.net https://events.bitwarden.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; script-src 'self'; media-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
devCsp = "default-src 'self' 'unsafe-eval' 'unsafe-inline'; connect-src 'self' http://localhost:* ws://localhost:* ipc: tauri: https://api.bitwarden.com https://notifications.bitwarden.com https://vault.bitwarden.com https://identity.bitwarden.com https://icons.bitwarden.net https://events.bitwarden.com"
freezePrototype = false
dangerousDisableAssetCspModification = false

[app.security.assetProtocol]
enable = true

[bundle]
active = true
targets = "all"
createUpdaterArtifacts = true
publisher = "Chiikawarden Team"
copyright = "Copyright © 2024 Chiikawarden. All rights reserved."
category = "Productivity"
shortDescription = "Secure password manager"
longDescription = "A modern, secure password manager with Bitwarden compatibility. Features end-to-end encryption, biometric unlock, and cross-platform synchronization."
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico"
]
resources = []
externalBin = []

[bundle.windows]
certificateThumbprint = ""
digestAlgorithm = "sha256"
timestampUrl = ""
allowDowngrades = false

[bundle.windows.nsis]
installMode = "currentUser"

[bundle.linux.deb]
depends = ["libwebkit2gtk-4.1-dev", "libappindicator3-dev"]
files = {}

[bundle.linux.appimage]
bundleMediaFramework = true
files = {}

[bundle.macOS]
frameworks = []
minimumSystemVersion = "10.13.0"
exceptionDomain = "localhost"
signingIdentity = ""
providerShortName = ""
entitlements = ""
hardenedRuntime = true
files = {}

[plugins.updater]
active = false
dialog = true
pubkey = ""
endpoints = []

[plugins.updater.windows]
webviewInstallMode = "currentUser"

[plugins.shell]
open = true 