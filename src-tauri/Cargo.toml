  [package]  
name = "chiikawarden"
version = "0.1.0"
description = "A Tauri App"
authors = ["niskan516"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chiikawarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = ["config-toml"] }

[dependencies]
tauri = { version = "2.6.2", features = ["devtools", "macos-private-api", "protocol-asset", "test"] }
tauri-plugin-opener = "2.4.0"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid", "json"] }
tauri-plugin-store = "2.3.0"
tauri-plugin-fs = "2.4.0"
tauri-plugin-os = "2.3.0"
tauri-plugin-shell = "2.3.0"
tauri-plugin-window-state = "2.3.0"
tauri-plugin-single-instance = "2.3.0"
tauri-plugin-updater = "2.9.0"
tauri-plugin-http = "2.5.0"
tauri-plugin-log = "2"

# Serialization and async
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }

# Network and WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Cryptography (AWS-LC-RS for cross-platform compatibility)
aws-lc-rs = "1.13.3"  # AWS-LC based crypto library (FIPS-validated, Bitwarden-compatible)
aes-gcm = "0.10.3"     # AEAD encryption
argon2 = "0.5.3"       # Memory-hard key derivation
rsa = "0.9.8"          # Asymmetric encryption
sha2 = "0.10.9"        # Hash functions (still needed for Argon2)
hex = "0.4.3"          # Hex encoding/decoding for debugging

# Security utilities
zeroize = "1.8.1"  # Secure memory clearing
subtle = "2.6.1"   # Constant-time comparisons for security
rand = "0.8.5"     # Random number generation

# HTTP client and utilities (using Tauri HTTP plugin instead of reqwest)
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
url = "2.5.4"
base64 = "0.22.1"
anyhow = "1.0.98" # Error handling
thiserror = "2.0.12" # Error derive macros
log = "0.4.27" # Logging facade
env_logger = "0.11.8" # Environment-based logger
tracing = "0.1.41" # Structured logging
tracing-subscriber = { version = "0.3.19", features = [
     "chrono", 
     "env-filter", 
     "ansi",
] } # Tracing subscriber with required features
tracing-appender = "0.2.3" # File appender for tracing
tracing-log = "0.2" # Bridge between tracing and log crate
dotenvy = "0.15" # Environment variable loading from .env files

# Async utilities
futures = "0.3.31"
async-trait = "0.1.88"
lazy_static = "1.5.0" # Global static variables

# System integration
keyring = "3.6.2" # OS keyring for refresh tokens
iota_stronghold = "2.1.0" # Local vault for master password hash/vault key
dirs = "6.0.0" # Platform-specific directories
hostname = "0.4.0" # System hostname detection
tauri-specta = { version = "2.0.0-rc.21", features = ["javascript", "typescript"] }
specta = { version = "2.0.0-rc.22", features = ["derive", "chrono"] }
specta-typescript = "0.0.9"
regex = "1.11.1"

[dev-dependencies]
tempfile = "3.8"
tracing-test = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26.1" 
objc = "0.2.7"

[target."cfg(target_os = \"windows\")".dependencies]
webview2-com = "0.38.0"
windows = "0.61.3"
windows-core = "0.61.2"
windows-version = "0.1"

[target."cfg(target_os = \"linux\")".dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
