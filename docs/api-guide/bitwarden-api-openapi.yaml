    # Additional endpoints for completeness
  /ciphers/import:
    post:
      tags: [Ciphers]
      summary: Import ciphers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ciphers:
                  type: array
                  items:
                    $ref: '#/components/schemas/CipherRequest'
                folders:
                  type: array
                  items:
                    $ref: '#/components/schemas/FolderRequest'
                folderRelationships:
                  type: array
                  items:
                    type: array
                    items:
                      type: integer
      responses:
        '200':
          description: Import completed successfully

  /ciphers/{id}/attachment:
    post:
      tags: [Ciphers]
      summary: Create attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:
                  type: string
                data:
                  type: string
                  format: binary
      responses:
        '200':
          description: Attachment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CipherResponse'

  /ciphers/{id}/attachment/{attachmentId}:
    delete:
      tags: [Ciphers]
      summary: Delete attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment deleted successfully

  # Two-Factor Authentication
  /two-factor:
    get:
      tags: [Two-Factor]
      summary: Get two-factor providers
      responses:
        '200':
          description: Two-factor providers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TwoFactorProviderResponse'
                  object:
                    type: string
                    example: "list"

  /two-factor/authenticator:
    post:
      tags: [Two-Factor]
      summary: Enable authenticator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                masterPasswordHash:
                  type: string
                token:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: Authenticator enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorAuthenticatorResponse'

    TwoFactorProviderResponse:
      type: object
      properties:
        type:
          type: integer
        enabled:
          type: boolean
        object:
          type: string
          example: "twoFactorProvider"

    TwoFactorAuthenticatorResponse:
      type: object
      properties:
        enabled:
          type: boolean
        key:
          type: string
        qr:
          type: string
        object:
          type: string
          example: "twoFactorAuthenticator"
