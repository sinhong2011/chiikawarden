name: TypeScript Type Generation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src-tauri/**'
      - 'src/lib/tauri-commands.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src-tauri/**'
      - 'src/lib/tauri-commands.ts'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-typescript-generation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
    
    - name: Generate TypeScript types
      working-directory: src-tauri
      run: |
        # Run cargo to generate TypeScript types
        cargo run --bin chiikawarden 2>/dev/null || true
        # Give it a moment to generate the types
        sleep 2
    
    - name: Validate TypeScript generation
      working-directory: src-tauri
      run: |
        # Run the TypeScript generation validation tests
        cargo test typescript_generation_tests --verbose
    
    - name: Check for any types in generated file
      run: |
        if [ -f "src/lib/tauri-commands.ts" ]; then
          echo "✅ TypeScript file exists"
          
          # Check for problematic patterns
          if grep -n "as any\|: any\|<any>\|Record<string, any>\|unknown as any" src/lib/tauri-commands.ts; then
            echo "❌ Found 'any' types in generated TypeScript file"
            exit 1
          else
            echo "✅ No 'any' types found in generated TypeScript file"
          fi
          
          # Check file size (should be substantial)
          file_size=$(wc -c < src/lib/tauri-commands.ts)
          if [ $file_size -lt 1000 ]; then
            echo "❌ Generated TypeScript file seems too small ($file_size bytes)"
            exit 1
          else
            echo "✅ Generated TypeScript file has appropriate size ($file_size bytes)"
          fi
          
          # Check for expected exports
          if grep -q "export const commands" src/lib/tauri-commands.ts && \
             grep -q "export type AppError" src/lib/tauri-commands.ts && \
             grep -q "export type Result" src/lib/tauri-commands.ts; then
            echo "✅ All expected exports found in TypeScript file"
          else
            echo "❌ Missing expected exports in TypeScript file"
            exit 1
          fi
        else
          echo "❌ TypeScript file not found"
          exit 1
        fi
    
    - name: Validate type-safe replacements
      run: |
        if [ -f "src/lib/tauri-commands.ts" ]; then
          # Check for expected type-safe patterns
          patterns_found=0
          
          if grep -q "e as string" src/lib/tauri-commands.ts; then
            echo "✅ Found proper error type casting"
            patterns_found=$((patterns_found + 1))
          fi
          
          if grep -q "Record<string, unknown>" src/lib/tauri-commands.ts; then
            echo "✅ Found proper Record type"
            patterns_found=$((patterns_found + 1))
          fi
          
          if grep -q "Parameters<typeof" src/lib/tauri-commands.ts; then
            echo "✅ Found proper parameter types"
            patterns_found=$((patterns_found + 1))
          fi
          
          if [ $patterns_found -eq 0 ]; then
            echo "❌ No type-safe patterns found - fixes may not be applied"
            exit 1
          else
            echo "✅ Found $patterns_found type-safe patterns"
          fi
        fi
    
    - name: Upload TypeScript file as artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: generated-typescript-types
        path: src/lib/tauri-commands.ts
        retention-days: 7
