name: Chiikawarden
options:
  bundleIdPrefix: io.github.sinhong2011
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: FX3VR69P5K
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
packages:
  VaultCore:
    path: Packages/VaultCore
targets:
  Chiikawarden:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      - path: Design/AppIcon/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: ChiikawaCrypto
      - package: VaultCore
        product: VaultwardenAPI
    entitlements:
      path: App/Chiikawarden.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chiikawarden
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-HK, zh-Hans, ja]
        # Self-hosted servers on the LAN (IPs, .local) are often plain HTTP or private-CA.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
