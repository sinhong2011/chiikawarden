name: Chiikawarden
options:
  bundleIdPrefix: io.github.sinhong2011
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: FX3VR69P5K
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
packages:
  VaultCore:
    path: Packages/VaultCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Chiikawarden:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
      - AutoFill/AutoFillView.swift # also rendered by --snapshot
      - path: Design/AppIcon/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: ChiikawaCrypto
      - package: VaultCore
        product: VaultwardenAPI
      - package: VaultCore
        product: SSHAgent
      - package: Sparkle # signed, verified in-place updates
      - target: ChiikawardenAutoFill
        embed: true
      - target: ChiikawardenSafari
        embed: true
      - target: cw
        embed: true
        codeSign: false # keep cw's own signature (and its App Group entitlement)
        copy:
          destination: executables
    entitlements:
      path: App/Chiikawarden.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true # attachments: add and Save As
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.chiikawarden]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.sinhong2011.chiikawarden.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Sparkle's installer runs as an XPC service outside the sandbox; the app may talk to it.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chiikawarden
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-HK, zh-Hans, ja]
        # Updates (Sparkle): appcast attached to the latest GitHub release; every update must carry an EdDSA
        # signature made with the private key matching SUPublicEDKey (set by `make sparkle-keys`).
        SUFeedURL: https://github.com/sinhong2011/chiikawarden/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false # opt-in: the user turns automatic checks on in Settings
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        # Self-hosted servers on the LAN (IPs, .local) are often plain HTTP or private-CA.
        NSServices:
          - NSMenuItem: {default: "Generate Password with Chiikawarden"}
            NSMessage: generatePassword
            NSPortName: Chiikawarden
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES # Xcode canvas: see App/Sources/Previews.swift
        SPARKLE_PUBLIC_KEY: "" # sparkle-public-key (written by `make sparkle-keys`; the private key never enters the repo)
    scheme:
      testTargets: [ChiikawardenUITests]

  ChiikawardenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Chiikawarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Chiikawarden

  ChiikawardenSafari:
    type: app-extension
    platform: macOS
    sources:
      - BrowserExtension/Safari
      - path: BrowserExtension/WebExtension # copied flat: Safari wants manifest.json at Resources/
        buildPhase: resources
    dependencies:
      - package: VaultCore
        product: SSHAgent
    entitlements:
      path: BrowserExtension/Safari/ChiikawardenSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.chiikawarden]
    info:
      path: BrowserExtension/Safari/Info.plist
      properties:
        CFBundleDisplayName: Chiikawarden
        NSHumanReadableDescription: Fill and save logins from your Chiikawarden vault.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden.safari
        GENERATE_INFOPLIST_FILE: NO

  cw:
    type: tool
    platform: macOS
    sources:
      - CLI/main.swift
    dependencies:
      - package: VaultCore
        product: SSHAgent
    entitlements:
      path: CLI/cw.entitlements
      properties:
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.chiikawarden] # reach the app's socket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden.cw
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  ChiikawardenAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - AutoFill
      - Shared
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: VaultCore
        product: ChiikawaCrypto
      - package: VaultCore
        product: VaultwardenAPI
    entitlements:
      path: AutoFill/ChiikawardenAutoFill.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [FX3VR69P5K.io.github.sinhong2011.chiikawarden]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.sinhong2011.chiikawarden.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.network.client: true # saving new passkeys to the server
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Chiikawarden
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-HK, zh-Hans, ja]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesOneTimeCodes: true
              ProvidesPasskeys: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sinhong2011.chiikawarden.autofill
        GENERATE_INFOPLIST_FILE: NO
